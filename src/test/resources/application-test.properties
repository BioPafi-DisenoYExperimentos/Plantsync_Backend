# Configuración para Tests de Integración
spring.application.name=PlantSync-Test
cors.allowed-origins=http://localhost:3000
# Usar H2 en memoria
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;INIT=SET REFERENTIAL_INTEGRITY FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Hibernate y Flyway
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
# Weather API
weather.api.key=dummy-key
# Logging
logging.level.org.springframework.web=INFO
logging.level.com.plantsync.platform=DEBUG
