# Spring Application Name
spring.application.name=PlantSync Backend
# CORS Configuration
cors.allowed-origins=http://localhost:3000,http://localhost:4200
# Profile
spring.profiles.active=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true
#Spring Data JPA Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=com.plantsync.platform.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy
authorization.jwt.secret=WriteHereYourSecretStringForTokenSigningCredentials
authorization.jwt.expiration.days=7
spring.datasource.url=jdbc:mysql://localhost:3306/plantsyncdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=kevin
spring.datasource.password=kevin
weather.api.key=${WEATHERAPIKEY}
# Elements take their values from maven pom.xml build-related information
documentation.application.description=@project.description@
documentation.application.version=@project.version@
# Flyway Configuration
spring.flyway.enabled=false